name: ledger_pro
publish_to: 'none'
version: 1.0.3+4
description: Offline-first Arabic RTL multi-currency accounting ledger.
environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.0
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  intl: ^0.20.2
  uuid: ^4.5.1
  share_plus: ^11.0.0
  pdf: ^3.11.3
  printing: ^5.14.2
  image_picker: ^1.1.2
  file_picker: ^8.3.7
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  connectivity_plus: ^6.1.4
  fl_chart: ^0.70.2
  url_launcher: ^6.3.1
  google_sign_in: ^6.2.2
  googleapis: ^13.2.0
  http: ^1.3.0
  flutter_local_notifications: ^18.0.1

dependency_overrides:
  # image 4.11.0 currently calls archive's decodeLazy API, which is absent
  # from the archive 4.0.9 selected by pub on the release runner.
  # Keep the compatible image release until the transitive packages align.
  image: 4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true