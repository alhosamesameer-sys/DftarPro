plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'dev.flutter.flutter-gradle-plugin'
}
android {
    namespace 'com.example.dftar'
    compileSdk 36
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17; coreLibraryDesugaringEnabled true }
    kotlinOptions { jvmTarget = '17' }
    defaultConfig { applicationId 'com.example.dftar'; minSdk 24; targetSdk 36; versionCode 3; versionName '1.0.2' }
    signingConfigs { release { storeFile file('../keystore/ledgerpro-release.jks'); storePassword 'ledgerpro'; keyAlias 'ledgerpro'; keyPassword 'ledgerpro' } }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false; shrinkResources false } }
}
dependencies { coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5' }
flutter { source '../..' }