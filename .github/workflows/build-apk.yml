name: Build Ledger Pro APK

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.workers.max=1 -Xmx2g -XX:MaxMetaspaceSize=768m"
      JAVA_TOOL_OPTIONS: "-Xmx2g -XX:MaxMetaspaceSize=768m"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Configure permanent DftarPro release signing
        shell: bash
        env:
          DFTARPRO_KEYSTORE_BASE64: ${{ secrets.DFTARPRO_KEYSTORE_BASE64 }}
          DFTARPRO_KEYSTORE_PASSWORD: ${{ secrets.DFTARPRO_KEYSTORE_PASSWORD }}
          DFTARPRO_KEY_ALIAS: ${{ secrets.DFTARPRO_KEY_ALIAS }}
          DFTARPRO_KEY_PASSWORD: ${{ secrets.DFTARPRO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${DFTARPRO_KEYSTORE_BASE64:?Missing GitHub secret DFTARPRO_KEYSTORE_BASE64}"
          : "${DFTARPRO_KEYSTORE_PASSWORD:?Missing GitHub secret DFTARPRO_KEYSTORE_PASSWORD}"
          : "${DFTARPRO_KEY_ALIAS:?Missing GitHub secret DFTARPRO_KEY_ALIAS}"
          : "${DFTARPRO_KEY_PASSWORD:?Missing GitHub secret DFTARPRO_KEY_PASSWORD}"

          mkdir -p "$HOME/.android"
          echo "$DFTARPRO_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/dftarpro-release.jks"
          test -s "$HOME/.android/dftarpro-release.jks"

          cat > android/key.properties <<EOF
          storeFile=$HOME/.android/dftarpro-release.jks
          storePassword=$DFTARPRO_KEYSTORE_PASSWORD
          keyAlias=$DFTARPRO_KEY_ALIAS
          keyPassword=$DFTARPRO_KEY_PASSWORD
          EOF

          echo "Permanent DftarPro release keystore configured."
          echo "Release signing certificate:"
          keytool -list -v \
            -keystore "$HOME/.android/dftarpro-release.jks" \
            -storepass "$DFTARPRO_KEYSTORE_PASSWORD" \
            -alias "$DFTARPRO_KEY_ALIAS" |
            grep -E "Alias name:|SHA1:|SHA256:"

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk/* || true
          sudo rm -rf /usr/local/lib/android/sdk/cmake/* || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          df -h

      - name: Flutter diagnostics
        run: |
          flutter --version
          java -version
          flutter config --no-analytics
          echo "Verifying DftarPro native PDF, Word HTML and Google Drive backup integration"

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --no-pub

      - name: Verify release APK and signing
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -f "$APK"
          ls -lh "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$APKSIGNER"
          echo "========================================"
          echo "APK package and permanent certificate"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          echo "========================================"
          echo "APK built and permanent release signature verified successfully."

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dftar-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Write release build summary
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          {
            echo "## DftarPro Release APK"
            echo "- Build succeeded: $APK"
            echo "- Package: com.example.dftar"
            echo "- Signing: permanent DftarPro release keystore"
            echo "- Version: 1.0.3 (versionCode 4)"
            echo ""
            echo "### Signing certificate"
            keytool -list -v \
              -keystore "$HOME/.android/dftarpro-release.jks" \
              -storepass "${{ secrets.DFTARPRO_KEYSTORE_PASSWORD }}" \
              -alias "${{ secrets.DFTARPRO_KEY_ALIAS }}" > /tmp/dftarpro-cert.txt\n            grep -E "Alias name:|SHA1:|SHA256:" /tmp/dftarpro-cert.txt\n            rm -f /tmp/dftarpro-cert.txt
            echo ""
            ls -lh "$APK"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          rm -f android/key.properties "$HOME/.android/dftarpro-release.jks"
